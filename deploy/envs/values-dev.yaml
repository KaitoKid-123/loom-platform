api:
  tag: dev
  replicas: 2
web:
  tag: dev
  replicas: 2
ingress:
  host: loom-dev.internal
  # https:// ở dưới giả định TLS được chấm dứt phía trước Ingress này
  # (load balancer/reverse proxy ngoài cụm) — ingress.yaml không có tls: stanza.
app:
  environment: dev
  logLevel: INFO
  cookieSecure: true
  publicBaseUrl: https://loom-dev.internal
oidc:
  issuer: https://loom-dev.internal/dex
  redirectUrl: https://loom-dev.internal/api/v1/auth/callback
  # Dev là môi trường triển khai thật — không được kế thừa khoá ký công khai
  # trong values.yaml. `Settings` sẽ từ chối khởi động nếu quên (xem Task 2).
  existingSecret: loom-app-secrets
storage:
  # dev/prod KHÔNG chạy MinIO trong cụm — deploy/infra/minio.yaml chỉ dành cho
  # local. Điền endpoint thật khi dựng VPS; tới lúc đó chưa có mặt phẳng dữ liệu.
  endpoint: ""
  bucket: loom-dev
lakekeeper:
  # CỐ Ý tắt, và tạm thời: chưa có endpoint storage thì một Lakekeeper chạy được
  # cũng không catalog được gì. Bật cùng lúc với VPS.
  enabled: false

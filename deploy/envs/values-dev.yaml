api:
  tag: dev
  replicas: 2
query:
  tag: dev
  replicas: 2
web:
  tag: dev
  replicas: 2
ingress:
  host: loom-dev.internal
  # https:// ở dưới giả định TLS được chấm dứt phía trước Ingress này
  # (load balancer/reverse proxy ngoài cụm) — ingress.yaml không có tls: stanza.
app:
  environment: dev
  logLevel: INFO
  cookieSecure: true
  publicBaseUrl: https://loom-dev.internal
oidc:
  issuer: https://loom-dev.internal/dex
  redirectUrl: https://loom-dev.internal/api/v1/auth/callback
  # Dev là môi trường triển khai thật — không được kế thừa khoá ký công khai
  # trong values.yaml. `Settings` sẽ từ chối khởi động nếu quên (xem Task 2).
  # PHẢI có đủ BỐN khoá: `oidc-client-secret`, `session-secret`, (Task 10/11)
  # `query-shared-secret`, và (Giai đoạn 3a) `ingest-shared-secret` — thiếu
  # bất kỳ khoá nào cũng làm pod CreateContainerConfigError (secretKeyRef
  # không tìm thấy khoá), không phải một 401 âm thầm lúc runtime.
  #
  # `ingest-shared-secret` là khoá MỚI của Giai đoạn 3a và nó phải được thêm
  # TRƯỚC khi nâng cấp: đặt `oidc.existingSecret` làm `secret.yaml` không
  # render, nên chart KHÔNG tự tạo khoá này hộ — External Secrets/Vault phải
  # đồng bộ nó vào, cùng đường với `query-shared-secret`. Nó phải là một giá
  # trị KHÁC `query-shared-secret`, không phải bản sao: xem
  # `loom_core.config.Settings.task_shared_secret_key`.
  existingSecret: loom-app-secrets
storage:
  # dev/prod KHÔNG chạy MinIO trong cụm — deploy/infra/minio.yaml chỉ dành cho
  # local. Điền endpoint thật khi dựng VPS; tới lúc đó chưa có mặt phẳng dữ liệu.
  endpoint: ""
  bucket: loom-dev
lakekeeper:
  # CỐ Ý tắt, và tạm thời: chưa có endpoint storage thì một Lakekeeper chạy được
  # cũng không catalog được gì. Bật cùng lúc với VPS.
  enabled: false

api:
  tag: dev
  replicas: 2
query:
  tag: dev
  replicas: 2
web:
  tag: dev
  replicas: 2
scheduler:
  tag: dev
  # KHÔNG nâng lên 2 ở đây dù api/query/web đều là 2. Hai replica không hỏng
  # (`UNIQUE (pipeline_id, scheduled_for)` giữ tick idempotent — xem
  # `scheduler-deployment.yaml`), nhưng chúng cũng không mua thêm gì: replica
  # của api/query/web tồn tại để CHIA TẢI request đến, còn cái đồng hồ không
  # có tải đến nào để chia.
  replicas: 1
task:
  # Không có `replicas`: ảnh này chạy dưới dạng Job một-lần do `loom-api` phóng,
  # không phải một Deployment (xem values.yaml, mục `task`). Chỉ `tag` cần đè —
  # thiếu dòng này thì dev phóng pod nạp bằng ảnh `:dev` của values.yaml, tình cờ
  # đúng ở đây và SAI ở prod, đúng loại lỗi chỉ lộ ra ở một môi trường.
  tag: dev
ingress:
  host: loom-dev.internal
  # https:// ở dưới giả định TLS được chấm dứt phía trước Ingress này
  # (load balancer/reverse proxy ngoài cụm) — ingress.yaml không có tls: stanza.
app:
  environment: dev
  logLevel: INFO
  cookieSecure: true
  publicBaseUrl: https://loom-dev.internal
oidc:
  issuer: https://loom-dev.internal/dex
  redirectUrl: https://loom-dev.internal/api/v1/auth/callback
  # Dev là môi trường triển khai thật — không được kế thừa khoá ký công khai
  # trong values.yaml. `Settings` sẽ từ chối khởi động nếu quên (xem Task 2).
  # PHẢI có đủ NĂM khoá trong Secret `loom-app-secrets`: `oidc-client-secret`,
  # `session-secret`, `query-shared-secret` (Task 10/11), `ingest-shared-secret`
  # (Giai đoạn 3a), và `schedule-shared-secret` (Giai đoạn 3b/scheduler). Thiếu
  # bất kỳ khoá nào cũng làm pod CreateContainerConfigError (secretKeyRef không
  # tìm thấy khoá), không phải một 401 âm thầm lúc runtime.
  #
  # `ingest-shared-secret` và `schedule-shared-secret` là hai khoá MỚI của
  # Giai đoạn 3. Khi đặt `oidc.existingSecret`, `secret.yaml` không render,
  # nên chart KHÔNG tự tạo hai khoá này hộ — External Secrets/Vault phải đồng
  # bộ cả hai vào, cùng đường với `query-shared-secret`. Mỗi khoá phải có giá
  # trị RIÊNG, không phải bản sao của khoá khác: xem
  # `loom_core.internal_auth` cho lý do tách ba bí mật.
  existingSecret: loom-app-secrets
storage:
  # dev/prod KHÔNG chạy MinIO trong cụm — deploy/infra/minio.yaml chỉ dành cho
  # local. Điền endpoint thật khi dựng VPS; tới lúc đó chưa có mặt phẳng dữ liệu.
  endpoint: ""
  bucket: loom-dev
lakekeeper:
  # CỐ Ý tắt, và tạm thời: chưa có endpoint storage thì một Lakekeeper chạy được
  # cũng không catalog được gì. Bật cùng lúc với VPS.
  enabled: false

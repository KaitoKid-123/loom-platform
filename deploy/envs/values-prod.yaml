api:
  tag: prod
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
query:
  tag: prod
  replicas: 3
web:
  tag: prod
  replicas: 2
ingress:
  host: loom.internal
  # https:// ở dưới giả định TLS được chấm dứt phía trước Ingress này
  # (load balancer/reverse proxy ngoài cụm) — ingress.yaml không có tls: stanza.
app:
  environment: prod
  logLevel: INFO
  cookieSecure: true
  publicBaseUrl: https://loom.internal
oidc:
  issuer: https://loom.internal/dex
  redirectUrl: https://loom.internal/api/v1/auth/callback
  # Production không bao giờ để secret trong values — ESO đồng bộ Secret này.
  # PHẢI có đủ BA khoá — xem comment tương ứng ở values-dev.yaml.
  existingSecret: loom-app-secrets
storage:
  # dev/prod KHÔNG chạy MinIO trong cụm — deploy/infra/minio.yaml chỉ dành cho
  # local. Điền endpoint thật khi dựng VPS; tới lúc đó chưa có mặt phẳng dữ liệu.
  endpoint: ""
  bucket: loom-prod
lakekeeper:
  # CỐ Ý tắt, và tạm thời: chưa có endpoint storage thì một Lakekeeper chạy được
  # cũng không catalog được gì. Bật cùng lúc với VPS.
  enabled: false

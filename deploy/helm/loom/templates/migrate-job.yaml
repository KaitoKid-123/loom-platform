{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "loom.fullname" . }}-migrate
  labels:
    {{- include "loom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "loom.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          workingDir: /app/services/api
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "loom.apiEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          # Kiểm chứng: `docker run --rm --read-only -w /app/services/api
          # loom/api:dev alembic history` chạy sạch, exit 0 — alembic không
          # cần ghi gì ra rootfs cho lệnh `upgrade head`.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            {{- include "loom.dbCaVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "loom.dbCaVolume" . | nindent 8 }}
{{- end }}

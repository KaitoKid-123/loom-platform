{{- if not .Values.oidc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loom.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
type: Opaque
stringData:
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  session-secret: {{ .Values.app.sessionSecret | quote }}
  # Bí mật chia sẻ giữa loom-api và loom-query qua header (Task 10/11) — xem
  # `loom_core.internal_auth` và `query-deployment.yaml`/`api-deployment.yaml`
  # (cả hai đọc CÙNG khoá này). Cùng khuôn `session-secret`.
  query-shared-secret: {{ .Values.app.querySharedSecret | quote }}
  # Bí mật chia sẻ của ĐƯỜNG NGƯỢC LẠI: pod nạp -> loom-api, trên
  # `/internal/ingest/*` (Giai đoạn 3a). Một KHOÁ riêng, không phải
  # `query-shared-secret` ngay trên dùng lại — xem
  # `loom_core.config.Settings.task_shared_secret_key`: `loom-query` không có
  # OIDC, nên ai cầm bí mật của nó thì giả được loom-api dưới danh nghĩa BẤT KỲ
  # principal nào, và pod nạp là thành phần duy nhất quay số ra một host do
  # người dùng nhập.
  #
  # Ở local hai khoá render ra CÙNG một chuỗi placeholder (xem `values.yaml`) —
  # đó là chỗ template này áp dụng được, và nó không phải chỗ việc tách bí mật
  # có tác dụng. Dev/prod không render file này chút nào; ở đó hai khoá là hai
  # giá trị thật khác nhau do External Secrets đồng bộ vào.
  #
  # Đọc bởi HAI nơi, cả hai đều qua `loom.appSecretName`: `api-deployment.yaml`
  # (biến `LOOM_INGEST_SHARED_SECRET`, để KIỂM header) và Job nạp do
  # `JobLauncher.launch` dựng lúc chạy (`secretKeyRef`, để pod GỬI header).
  ingest-shared-secret: {{ .Values.app.ingestSharedSecret | quote }}
  # Bí mật chia sẻ RIÊNG cho loom-scheduler (Giai đoạn 3b). Một KHOÁ riêng,
  # không phải hai khoá trên dùng lại. Ba bí mật ba quyền tách biệt: xem
  # `loom_core.internal_auth`.
  schedule-shared-secret: {{ .Values.app.scheduleSharedSecret | quote }}
{{- end }}

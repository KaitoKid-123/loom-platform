{{- if not .Values.oidc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loom.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
type: Opaque
stringData:
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  session-secret: {{ .Values.app.sessionSecret | quote }}
  # Bí mật chia sẻ giữa loom-api và loom-query qua header (Task 10/11) — xem
  # `loom_core.internal_auth` và `query-deployment.yaml`/`api-deployment.yaml`
  # (cả hai đọc CÙNG khoá này). Cùng khuôn `session-secret`.
  query-shared-secret: {{ .Values.app.querySharedSecret | quote }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.fullname" . }}-web
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "loom.name" . }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http

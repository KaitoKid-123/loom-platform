{{- if .Values.lakekeeper.enabled }}
# Lakekeeper là một Iceberg REST catalog VENDOR (quay.io/lakekeeper/catalog),
# không phải schema của loom-api. Vì thế migration của nó KHÔNG dùng Job có
# helm hook như migrate-job.yaml của alembic:
#
#   - migrate-job.yaml tồn tại vì schema alembic là CỦA CHÍNH loom-api — thay
#     đổi cần chạy MỘT LẦN có kiểm soát, có người xem lại trước khi áp dụng.
#   - Migration của Lakekeeper là idempotent và gắn chặt với phiên bản image
#     (`migrate` rồi mới `serve` được — xem --help ở deploy/versions.env).
#     Một Job có hook có thể chạy migrate của MỘT bản image trong khi pod
#     `serve` lại là bản khác nếu ai đó chỉ bump tag mà quên xoá Job cũ hoặc
#     hook không chạy lại. initContainer thì không thể lệch: nó luôn cùng
#     image, cùng pod spec với container serve.
#   - Không có vấn đề Job bất biến (values-local.yaml phải tắt migrate-job vì
#     `spec.template` bất biến giữa các lần `helm template | kubectl apply`
#     của Tilt), nên KHÔNG cần tắt ở local — cùng một đường chạy ở cả ba
#     môi trường, không cần local_resource riêng trong Tiltfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.fullname" . }}-lakekeeper
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: lakekeeper
spec:
  replicas: {{ .Values.lakekeeper.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakekeeper
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: lakekeeper
    spec:
      securityContext:
        # Image không khai USER (chạy root theo mặc định) nên `runAsNonRoot: true`
        # KHÔNG đủ — phải tự ghim `runAsUser`.
        #
        # 65532, KHÔNG PHẢI 1000, và con số này mua bằng một CrashLoopBackOff:
        #
        #     exec: "/home/nonroot/lakekeeper": stat ...: permission denied
        #
        # Đây là base image distroless, binary nằm trong `/home/nonroot/` với quyền
        # chỉ cho đúng user `nonroot` của distroless — uid 65532. Cái bẫy là uid 1000
        # trông như chạy được: `docker run --user 1000 <image> version` in ra "0.9.2"
        # bình thường. Nó chạy được CHỈ vì bộ capability mặc định của Docker có
        # `CAP_DAC_OVERRIDE`, thứ cho phép bỏ qua kiểm tra quyền tệp.
        #
        # Thêm `capabilities.drop: [ALL]` ở dưới là lấy đi đúng cái nạng đó, và sự
        # thật lộ ra. Đã kiểm cả bốn tổ hợp:
        #
        #     uid 1000  + read-only                      → chạy
        #     uid 1000  + drop ALL                       → HỎNG (permission denied)
        #     uid 65532 + drop ALL + read-only           → chạy
        #     uid 65532:65532 + drop ALL + read-only     → chạy
        #
        # Cách chữa SAI là trả lại capability cho uid 1000 mượn quyền. Cách đúng là
        # chạy đúng uid sở hữu binary, và giữ nguyên drop ALL.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Chạy `migrate` với CÙNG image, CÙNG env (dùng chung helper
        # loom.lakekeeperEnv với container `lakekeeper` bên dưới) trước khi
        # container chính `serve`. Sai một khoá ở đây nghĩa là migrate chạy
        # nhầm sang database khác — xem `make helm-validate` cho phép canh.
        - name: migrate
          image: "{{ .Values.lakekeeper.image }}:{{ .Values.lakekeeper.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["migrate"]
          env:
            {{- include "loom.lakekeeperEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.lakekeeper.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: lakekeeper
          image: "{{ .Values.lakekeeper.image }}:{{ .Values.lakekeeper.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8181
          env:
            {{- include "loom.lakekeeperEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.lakekeeper.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}

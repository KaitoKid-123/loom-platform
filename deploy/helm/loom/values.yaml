nameOverride: ""
imagePullPolicy: IfNotPresent

api:
  image: loom/api
  tag: dev
  replicas: 1
  # Chỉ bật ở local: uvicorn --reload và cho phép ghi vào rootfs để Tilt sync mã nguồn
  devReload: false
  # Số giây pod tiếp tục phục vụ SAU khi Kubernetes quyết định xoá nó.
  #
  # Endpoint bị gỡ khỏi Service KHÔNG đồng bộ với việc pod nhận SIGTERM, nên trong
  # vài trăm mili-giây tới vài giây, Traefik vẫn gửi request vào một pod đang tắt.
  # Không có preStop thì MỌI lần rollout — kể cả mỗi lần ArgoCD đồng bộ ở dev/prod —
  # đều làm rơi một phần request. Đo được ở local: `make smoke` chạy ngay sau
  # `rollout restart` hỏng 4/9 phép, trong đó có `healthz`, một endpoint không dính
  # gì tới đăng nhập.
  #
  # Kubernetes chạy preStop rồi MỚI gửi SIGTERM, nên trong lúc ngủ pod vẫn phục vụ
  # bình thường. Phải nhỏ hơn terminationGracePeriodSeconds một khoảng đủ để uvicorn
  # đóng nốt request đang dở.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

query:
  image: loom/query
  tag: dev
  replicas: 1
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # `resources.limits.memory: 384Mi` là con số từ phép đo Giai đoạn 2a
  # (`make measure-spill` — DuckDB `memory_limit=256MB`/`threads=2` trong một
  # cgroup 384Mi thật, xem docstring `loom_query.runner`). ĐỪNG đổi số này mà
  # không đo lại: nó gắn liền với `_MEMORY_LIMIT`/`_THREADS` ghim cứng trong
  # `runner.py`, không phải một ước lượng rời.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

web:
  image: loom/web
  tag: dev
  replicas: 1
  # Cùng lý do như api — xem ghi chú ở trên.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # An toàn: nginx chỉ cần ghi vào /tmp, đã có emptyDir mount ở đó.
  readOnlyRootFilesystem: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

ingress:
  enabled: true
  className: traefik
  host: loom.localhost

database:
  # Postgres là dịch vụ NGOÀI (Aiven.io) ở cả ba môi trường. Host/port/dbname
  # đến từ cùng Secret với credential, do External Secrets đồng bộ từ Vault —
  # xem Task 14. Tên Secret giữ nguyên `loom-db-app` từ thời CloudNativePG, cố ý:
  # đổi nhà cung cấp database không cần sửa chart.
  existingSecret: loom-db-app
  usernameKey: username
  passwordKey: password
  hostKey: host
  portKey: port
  nameKey: dbname
  # CA của Aiven, cùng Secret. PHẢI có: kết nối đi qua Internet công cộng nên
  # ssl=require (mã hoá, không xác thực server) là chưa đủ — cần verify-full.
  caKey: ca.pem
  sslMode: verify-full
  # Lakekeeper dùng một database RIÊNG trên CÙNG Aiven service. Tên nó đến từ
  # chính Secret này, không từ values: mọi tham số kết nối khác đều ở đây, và
  # tách một cái ra chỗ khác là chia thông tin kết nối làm hai nơi.
  lakekeeperNameKey: lakekeeper_dbname

oidc:
  issuer: http://loom.localhost/dex
  internalBase: http://dex.loom.svc.cluster.local:5556
  clientId: loom
  redirectUrl: http://loom.localhost/api/v1/auth/callback
  # Để trống thì chart tự tạo Secret từ oidc.clientSecret bên dưới.
  # Production đặt tên Secret do External Secrets Operator đồng bộ.
  existingSecret: ""
  clientSecret: loom-dev-secret

app:
  environment: local
  logLevel: INFO
  publicBaseUrl: http://loom.localhost
  cookieSecure: false
  sessionTtlHours: 12
  sessionSecret: dev-only-do-not-use-in-production
  # Bí mật chia sẻ qua header giữa loom-api và loom-query (Task 10/11) — cùng
  # khuôn `sessionSecret`: hằng số ở local, Secret do External Secrets đồng bộ
  # ở dev/prod (xem `oidc.existingSecret`/`secret.yaml`). `loom_core.config.
  # Settings._reject_default_secrets_outside_local` từ chối khởi động
  # `loom-api` nếu giá trị này còn là mặc định khi `environment != "local"` —
  # `loom_query.config.Settings` có bản sao của CHÍNH NÓ của phép kiểm này.
  querySharedSecret: dev-only-do-not-use-in-production
  # Bí mật chia sẻ của đường NẠP: pod nạp -> loom-api trên `/internal/ingest/*`
  # (Giai đoạn 3a). Một KHOÁ riêng trong Secret, không phải `querySharedSecret`
  # ở trên dùng lại — `loom-query` không có OIDC, nên bí mật của nó mở được cả
  # mô hình RBAC dưới danh nghĩa bất kỳ ai, còn pod nạp là thành phần dễ bị
  # chiếm nhất (nó quay số ra một host do người dùng nhập). Xem
  # `loom_core.config.Settings.task_shared_secret_key`.
  #
  # Ở LOCAL hai khoá này cố tình mang CÙNG chuỗi placeholder: không có bí mật
  # thật nào ở local, và một chuỗi "mặc định không an toàn" duy nhất là điều
  # kiện để `Settings._reject_default_secrets_outside_local` nhận ra CẢ HAI.
  # Việc tách chỉ có tác dụng khi hai GIÁ TRỊ khác nhau, tức là ở dev/prod —
  # xem cảnh báo ngay dưới.
  #
  # ⚠️ dev/prod: `deploy/envs/values-{dev,prod}.yaml` đặt
  # `oidc.existingSecret: loom-app-secrets`, và khi đó `secret.yaml` KHÔNG
  # render chút nào — giá trị dưới đây bị bỏ qua hoàn toàn. Người vận hành PHẢI
  # tự thêm khoá `ingest-shared-secret` vào Secret `loom-app-secrets` (qua
  # External Secrets / Vault, cùng đường với `query-shared-secret`) TRƯỚC khi
  # nâng cấp. Thiếu nó, pod api kẹt ở `CreateContainerConfigError` ngay khi
  # khởi động vì `secretKeyRef` trỏ vào một khoá không tồn tại — hỏng ồn ào và
  # tức thì, đúng như nó nên thế, nhưng chỉ hiểu được nếu đã đọc dòng này.
  ingestSharedSecret: dev-only-do-not-use-in-production

migration:
  enabled: true

lakekeeper:
  # Iceberg REST catalog (OSS). Khác MinIO — nó là thành phần của ỨNG DỤNG nên
  # nằm trong chart, chạy ở cả ba môi trường.
  enabled: true
  image: quay.io/lakekeeper/catalog
  tag: v0.9.2
  replicas: 1
  # Lakekeeper mã hoá credential mà nó lưu. Ở local là hằng số; dev/prod lấy từ
  # Vault qua External Secrets, cùng đường với loom-db-app.
  encryptionSecret: ""
  encryptionKeyLocal: local-dev-only-not-a-real-key
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }

storage:
  # Endpoint S3 mà icebergkit và loom-query dùng. Ở local là MinIO trong cụm
  # (deploy/infra/minio.yaml). Ở dev/prod là endpoint ngoài — VPS riêng theo kế
  # hoạch của chủ dự án, xem spec Giai đoạn 2 mục 2.0.
  endpoint: http://minio.loom.svc.cluster.local:9000
  bucket: loom-local
  region: us-east-1
  # Credential GỐC, chỉ dùng để gọi STS AssumeRole. Thứ phát ra từ đó mới là cái
  # mà mã ứng dụng cầm, và nó không bao giờ rộng hơn một workspace.
  existingSecret: minio-root
  accessKeyKey: root-user
  secretKeyKey: root-password

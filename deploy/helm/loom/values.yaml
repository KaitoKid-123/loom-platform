nameOverride: ""
imagePullPolicy: IfNotPresent

api:
  image: loom/api
  tag: dev
  replicas: 1
  # Chỉ bật ở local: uvicorn --reload và cho phép ghi vào rootfs để Tilt sync mã nguồn
  devReload: false
  # Số giây pod tiếp tục phục vụ SAU khi Kubernetes quyết định xoá nó.
  #
  # Endpoint bị gỡ khỏi Service KHÔNG đồng bộ với việc pod nhận SIGTERM, nên trong
  # vài trăm mili-giây tới vài giây, Traefik vẫn gửi request vào một pod đang tắt.
  # Không có preStop thì MỌI lần rollout — kể cả mỗi lần ArgoCD đồng bộ ở dev/prod —
  # đều làm rơi một phần request. Đo được ở local: `make smoke` chạy ngay sau
  # `rollout restart` hỏng 4/9 phép, trong đó có `healthz`, một endpoint không dính
  # gì tới đăng nhập.
  #
  # Kubernetes chạy preStop rồi MỚI gửi SIGTERM, nên trong lúc ngủ pod vẫn phục vụ
  # bình thường. Phải nhỏ hơn terminationGracePeriodSeconds một khoảng đủ để uvicorn
  # đóng nốt request đang dở.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

web:
  image: loom/web
  tag: dev
  replicas: 1
  # Cùng lý do như api — xem ghi chú ở trên.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # An toàn: nginx chỉ cần ghi vào /tmp, đã có emptyDir mount ở đó.
  readOnlyRootFilesystem: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

ingress:
  enabled: true
  className: traefik
  host: loom.localhost

database:
  # Postgres là dịch vụ NGOÀI (Aiven.io) ở cả ba môi trường. Host/port/dbname
  # đến từ cùng Secret với credential, do External Secrets đồng bộ từ Vault —
  # xem Task 14. Tên Secret giữ nguyên `loom-db-app` từ thời CloudNativePG, cố ý:
  # đổi nhà cung cấp database không cần sửa chart.
  existingSecret: loom-db-app
  usernameKey: username
  passwordKey: password
  hostKey: host
  portKey: port
  nameKey: dbname
  # CA của Aiven, cùng Secret. PHẢI có: kết nối đi qua Internet công cộng nên
  # ssl=require (mã hoá, không xác thực server) là chưa đủ — cần verify-full.
  caKey: ca.pem
  sslMode: verify-full

oidc:
  issuer: http://loom.localhost/dex
  internalBase: http://dex.loom.svc.cluster.local:5556
  clientId: loom
  redirectUrl: http://loom.localhost/api/v1/auth/callback
  # Để trống thì chart tự tạo Secret từ oidc.clientSecret bên dưới.
  # Production đặt tên Secret do External Secrets Operator đồng bộ.
  existingSecret: ""
  clientSecret: loom-dev-secret

app:
  environment: local
  logLevel: INFO
  publicBaseUrl: http://loom.localhost
  cookieSecure: false
  sessionTtlHours: 12
  sessionSecret: dev-only-do-not-use-in-production

migration:
  enabled: true

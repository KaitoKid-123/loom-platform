apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # PLACEHOLDER — điền địa chỉ Vault của công ty khi triển khai dev/prod.
      # Manifest này là artefact CHỈ DÙNG CHO DEV/PROD: cụm k3d trên máy dev
      # không với tới được Vault của công ty, nên nó không được áp ở local.
      # Local nạp Secret từ deploy/local/ (xem Makefile target
      # `infra-local-secret` và deploy/local/aiven.env.example).
      server: https://vault.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: loom
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loom-db
  namespace: loom
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: loom-db-app       # tên chart đang chờ, giữ nguyên từ thời CNPG
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: loom/aiven, property: username }
    - secretKey: password
      remoteRef: { key: loom/aiven, property: password }
    - secretKey: host
      remoteRef: { key: loom/aiven, property: host }
    - secretKey: port
      remoteRef: { key: loom/aiven, property: port }
    - secretKey: dbname
      remoteRef: { key: loom/aiven, property: dbname }
    - secretKey: ca.pem
      remoteRef: { key: loom/aiven, property: ca }

# MinIO — object storage cho lakehouse, CHỈ Ở LOCAL.
#
# Nằm ở deploy/infra/ chứ không trong Helm chart, cùng lý do với Dex: đây là hạ
# tầng của môi trường, không phải một thành phần của ứng dụng. Chủ dự án dự định
# chuyển MinIO sang một VPS riêng (spec Giai đoạn 2 mục 2.0), lúc đó file này
# không còn được apply và chart chỉ đổi `storage.endpoint`.
#
# Ngân sách RAM: cụm có trần 1,8 GB. Limit ở dưới là 448Mi, KHÔNG phải 320Mi như
# Giai đoạn 2a đặt — xem khối giải thích ở `resources` bên dưới trước khi hạ nó.
# Vẫn phải đo lại tổng cả node (`make ram`) sau mỗi lần đổi con số đó.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: loom
type: Opaque
stringData:
  # CHỈ LOCAL. Đây là credential GỐC — nó có toàn quyền, và chính nó là thứ
  # `MinioStsProvider` dùng để gọi AssumeRole rồi thu hẹp lại theo từng workspace.
  # Ở dev/prod, Secret này do External Secrets đồng bộ từ Vault (xem
  # deploy/infra/external-secret.yaml), KHÔNG phải file này.
  root-user: loom-root
  root-password: loom-root-dev-only
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: loom
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # 20Gi là LỜI KHAI, KHÔNG PHẢI HÀNG RÀO — và đừng nâng nó.
      #
      # Đo thật trên cụm này (Giai đoạn 2c Task 1):
      #
      #   1. `local-path` KHÔNG thi hành hạn mức. Ghi 21 GB vào PVC "20Gi" chạy
      #      trơn ở 773 MB/s, không lỗi gì; `df` bên trong pod hiện nguyên
      #      filesystem 467 GB chứ không phải 20.
      #   2. PVC KHÔNG nâng tại chỗ được: `allowVolumeExpansion` không bật trên
      #      storageclass `local-path`, và kubectl từ chối thẳng —
      #      "only dynamically provisioned pvc can be resized".
      #
      # Cộng lại: nâng con số này đòi XOÁ VÀ TẠO LẠI PVC, tức là mất dữ liệu
      # lakehouse, để đổi lấy một con số không có tác dụng gì. Nên phép đo 50 GB
      # của Giai đoạn 2c ghi thẳng vào PVC "20Gi" này và chạy bình thường.
      #
      # RỦI RO THẬT, và nó không liên quan tới con số ở đây: KHÔNG có gì ngăn
      # MinIO ăn hết đĩa máy chủ. Một query chạy loạn hoặc một bài đo quá tay sẽ
      # lấp đầy phần trống của cả máy, không chỉ của cụm. Hàng rào thật phải là
      # quota ở phía MinIO (`mc quota set`) hoặc một filesystem riêng — chưa có
      # cái nào, và đó là việc của lúc chuyển sang VPS.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: loom
  labels: { app: minio }
spec:
  replicas: 1
  strategy:
    # Recreate, KHÔNG RollingUpdate: PVC là ReadWriteOnce nên pod mới không mount
    # được volume khi pod cũ còn giữ. RollingUpdate sẽ treo ở ContainerCreating
    # cho tới khi hết timeout, và thông báo lỗi không hề nói về accessMode.
    #
    # KHÔNG có preStop/terminationGracePeriodSeconds như api và web, và đó là chủ
    # đích: cơ chế đó vá cửa sổ pod-cũ-và-mới-cùng-nhận-traffic của RollingUpdate,
    # mà `Recreate` ở dưới không có cửa sổ đó. Khách của MinIO là SDK S3 phía
    # backend, tự retry lỗi kết nối tạm thời — khác traffic trình duyệt qua Traefik.
    type: Recreate
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      securityContext:
        # ĐỌC KỸ TRƯỚC KHI SỬA — chỗ này đã tốn một lần CrashLoopBackOff.
        #
        # `fsGroup` ở đây gần như KHÔNG làm gì trên cụm local, và đừng tin ngược
        # lại: k3d dùng provisioner `local-path` của Rancher, sinh ra PV kiểu
        # `Local`. Kubelet KHÔNG chown đệ quy cho PV kiểu `Local` (cùng khoảng
        # trống đã biết với `hostPath`) — nên `fsGroup` không đổi quyền của thư
        # mục sẵn có.
        #
        # Thứ THẬT SỰ làm uid 1000 ghi được là script cấp phát của provisioner:
        # nó `mkdir -m 0777` khi tạo volume MỚI. Hệ quả trực tiếp:
        #
        #   - Cụm dựng từ số không (Task 14) → volume mới, 0777, chạy tốt.
        #   - Cụm ĐANG CÓ với volume đã dùng khi MinIO còn chạy bằng root →
        #     thư mục con thuộc root, pod chết ngay:
        #     "FATAL Unable to initialize backend: Unable to write to the backend"
        #
        # Gặp trường hợp thứ hai thì xoá PVC cho nó cấp phát lại, KHÔNG phải gỡ
        # hardening (reclaimPolicy là Delete nên dữ liệu trong đó mất — ở local
        # chấp nhận được, trên VPS thì không):
        #
        #     kubectl -n loom delete pvc minio-data
        #     make infra
        #
        # Giữ `fsGroup` vì nó ĐÚNG với storage class thật (VPS, CSI driver) — chỉ
        # là nó không phải lý do mọi thứ chạy được ở local.
        fsGroup: 1000
      containers:
        - name: minio
          image: ${MINIO_IMAGE}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-root, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-root, key: root-password } }
            # MinIO là Go (RELEASE.2025-04-22 dựng bằng go1.24.2), và Go KHÔNG tự
            # đọc hạn mức cgroup. Không có biến này thì bộ thu gom rác nhắm theo
            # GOGC — tức theo TỐC ĐỘ PHÌNH của heap — mà hoàn toàn không biết trên
            # đầu nó có một cái trần. Nó phình qua trần, và hạt nhân giết tiến
            # trình; GC không hề "gần đạt" rồi mới thua, nó không nhìn thấy trần.
            #
            # GOMEMLIMIT là giới hạn MỀM: chạm nó thì GC làm việc cật lực chứ
            # không ai bị giết. Đặt nó ~78% của limit cứng để chừa chỗ cho phần
            # KHÔNG do runtime Go quản (stack của thread hệ điều hành, vùng mmap,
            # buffer của cgo) — GOMEMLIMIT chỉ tính phần bộ nhớ Go tự quản, không
            # phải RSS.
            - name: GOMEMLIMIT
              value: "352MiB"
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            # 320Mi (con số của Giai đoạn 2a) LÀM CHẾT MINIO dưới tải ghi thật.
            # Đây là số đo, không phải phỏng đoán — phép đo 50 GB của Giai đoạn 2c
            # đi được 40/200 lô (10 GB) trong 395s rồi dừng:
            #
            #     RESTARTS 1, lastState.terminated.reason: OOMKilled
            #     OSError ... curlCode 7, Could not connect to server
            #
            # Lấy mẫu cgroup 20s/lần trong lúc ghi cho thấy vì sao 320Mi không đủ:
            #
            #     anon    271 Mi   <- heap thật, KHÔNG thu hồi được
            #     file     39 Mi   <- page cache, thu hồi vô hại
            #     max   25,117     <- số lần chạm trần rồi phải thu hồi
            #
            # Điểm mấu chốt là phần `anon`. Một máy chủ lưu trữ lấp đầy page cache
            # tới trần là chuyện bình thường và vô hại, nên `memory.current` ~318Mi
            # tự nó KHÔNG chứng minh điều gì — đó là lý do phải tách hai cột. 271Mi
            # heap trên trần 320Mi thì chỉ còn ~49Mi cho mọi đợt tăng đột biến, và
            # một đợt upload multipart là đủ.
            #
            # 448Mi = 271Mi đo được, cộng chỗ cho GOMEMLIMIT 352MiB làm việc, cộng
            # biên. Cả node sau khi đổi vẫn phải dưới 1843Mi — `make ram` là trọng
            # tài, đừng suy ra trên giấy.
            requests: { cpu: 50m, memory: 320Mi }
            limits: { memory: 448Mi }
          securityContext:
            # Đã kiểm với đúng image pin: MinIO khởi động sạch dưới uid 1000 với
            # rootfs read-only. `/data` là PVC nên vẫn ghi được, và MinIO không
            # cần ghi vào chỗ nào khác.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: loom
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  namespace: loom
spec:
  # Job bất biến ở spec.template, và `make infra` chạy được nhiều lần. Không có
  # ttl thì lần apply thứ hai đỏ với "field is immutable". ttl 60s để Job tự dọn.
  ttlSecondsAfterFinished: 60
  backoffLimit: 10
  # Vòng `until` bên dưới nuốt mọi lỗi kết nối, nên `backoffLimit` KHÔNG cứu được
  # trường hợp MinIO không bao giờ Ready — Job sẽ lặp mãi mãi. Deadline là thứ
  # duy nhất biến "treo" thành "hỏng", và chỉ khi hỏng thì `kubectl wait` trong
  # `make infra` mới có gì để bắt.
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: ${MINIO_MC_IMAGE}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set loom http://minio:9000 "$ROOT_USER" "$ROOT_PASSWORD"; do
                echo "chờ MinIO..."; sleep 2
              done
              mc mb --ignore-existing loom/loom-local
              echo "bucket loom-local sẵn sàng"
          env:
            - name: ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-root, key: root-user } }
            - name: ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-root, key: root-password } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }

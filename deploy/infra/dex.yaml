apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: loom
data:
  config.yaml: |
    # Dex lấy path của issuer làm base path, nên nó phục vụ tại /dex
    issuer: http://loom.localhost/dex
    storage:
      type: memory        # local: mất session khi restart, chấp nhận được
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: loom
        name: Loom
        secret: loom-dev-secret
        redirectURIs:
          - http://loom.localhost/api/v1/auth/callback
    enablePasswordDB: true
    staticPasswords:
      # Mật khẩu: "password" — hash mẫu trong tài liệu Dex. CHỈ DÙNG Ở LOCAL.
      - email: long@loom.local
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: long
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: loom
  labels: { app: dex }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dex }
  template:
    metadata:
      labels: { app: dex }
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - { name: http, containerPort: 5556 }
          readinessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/dex, readOnly: true }
      volumes:
        - name: config
          configMap: { name: dex-config }
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: loom
spec:
  selector: { app: dex }
  ports:
    - { name: http, port: 5556, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: loom
spec:
  ingressClassName: traefik
  rules:
    - host: loom.localhost
      http:
        paths:
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# Không có mục này thì `alembic upgrade` chạy HOÀN TOÀN im lặng — kể cả khi nó
# vừa đổi schema của database thật. Lý do không nằm ở `level` của root:
# env.py gọi `fileConfig(...)`, mà fileConfig mặc định
# `disable_existing_loggers=True`, nên logger `alembic` (đã được tạo lúc
# import alembic.runtime.migration, tức TRƯỚC khi env.py chạy) bị TẮT hẳn vì
# không có tên trong [loggers]. Nâng root lên INFO cũng không cứu được.
#
# Hệ quả đã kiểm chứng: `make migrate` in ra đúng không dòng nào, nên không
# phân biệt được "đã chạy migration nào" với "không chạy gì cả" — cùng một cái
# bẫy "im lặng không có nghĩa là thành công" như snap uv.
#
# `handlers =` để rỗng là cố ý: bản ghi truyền lên handler của root. Level của
# logger cha KHÔNG lọc lại bản ghi đã truyền lên, chỉ level của handler mới
# lọc, mà handler_console là NOTSET — nên root vẫn ở WARNING cho mọi thứ khác.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[project]
name = "loom-api"
version = "0.1.0"
description = "Control plane API của Loom"
requires-python = ">=3.12"
dependencies = [
    "loom-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "itsdangerous>=2.2",
]

[tool.uv.sources]
loom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_api"]

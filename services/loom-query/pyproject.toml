[project]
name = "loom-query"
version = "0.1.0"
description = "Chạy SQL trên bảng Iceberg qua HTTP, sau cổng quyền của Giai đoạn 1"
requires-python = ">=3.12"
dependencies = [
    "loom-core",
    "loom-sql",
    "loom-iceberg",
    "loom-storage",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "structlog>=24.4",
    "duckdb>=1.1",
    "pyarrow>=18.0",
]

[tool.uv.sources]
loom-core = { workspace = true }
loom-sql = { workspace = true }
loom-iceberg = { workspace = true }
loom-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_query"]

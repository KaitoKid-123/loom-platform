[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "pydantic>=2.10",        # plugin mypy bên dưới cần nó có mặt ngay từ Task 1
    "testcontainers[postgres]>=4.9",
    "cryptography>=44.0",
    "psycopg2-binary>=2.9",  # driver sync chỉ dùng để verify schema trong test_migrations.py
    "boto3-stubs[s3,sts]>=1.35",
    "duckdb>=1.1",
    "testcontainers[minio]>=4.9",
    # Đọc manifest trong deploy/infra/ để khẳng định tính chất của chúng
    # (test_minio_memory_ceiling.py). Nó VỐN ĐÃ có sẵn trong venv như phụ thuộc
    # bắc cầu của `uvicorn[standard]` — nên phép canh chạy được mà không cần
    # dòng này, và đó chính là vấn đề: nó sẽ hỏng vào ngày uvicorn đổi extra,
    # với một thông báo lỗi chẳng liên quan gì tới MinIO.
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/core/src",
    "packages/storagekit/src",
    "packages/icebergkit/src",
    "packages/sqlkit/src",
    "services/api/src",
    "services/loom-query/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert được phép trong test

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]  # hằng số mật khẩu giả trong test

[tool.mypy]
python_version = "3.12"
strict = true
# mypy lỗi cứng nếu đường dẫn không tồn tại, nên danh sách này lớn dần theo repo.
# (Giai đoạn 1 từng ghi "từ đây không đổi nữa" — sai, Giai đoạn 2a thêm hai
# package. Câu đó đã bị gỡ chứ không phải quên.)
files = [
    "packages/core/src",
    "packages/storagekit/src",
    "packages/icebergkit/src",
    "packages/sqlkit/src",
    "services/api/src",
    "services/api/migrations",
    "services/loom-query/src",
    "scripts",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# testcontainers KHÔNG có py.typed nên dòng này là thật. pyiceberg và duckdb thì
# CÓ — thêm chúng vào đây là cấu hình chết hôm nay, và là một cái bẫy ngày mai:
# nếu một bản sau bỏ py.typed đi, mypy sẽ lặng lẽ ngừng kiểm import cho đúng chỗ
# `loom_iceberg` gọi nhiều API nhất. Để chúng ngoài danh sách thì trường hợp đó
# nổ ra thành lỗi lint, đúng như nó nên thế.
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services"]
markers = [
    "integration: cần Docker (testcontainers)",
    "benchmark: phép ĐO, không phải phép kiểm — chậm, chạy bằng make measure-*",
]
addopts = "-m 'not integration'"

[project]
name = "loom-sql"
version = "0.1.0"
description = "Đọc AST của SQL — kiểm cú pháp, trích phụ thuộc bảng, transpile. Không I/O."
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_sql"]

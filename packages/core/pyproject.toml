[project]
name = "loom-core"
version = "0.1.0"
description = "Model và cấu hình dùng chung giữa control plane và task pod"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_core"]

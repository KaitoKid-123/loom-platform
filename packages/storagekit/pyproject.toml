[project]
name = "loom-storage"
version = "0.1.0"
description = "Cấp credential S3 hẹp theo prefix của một workspace"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_storage"]

[project]
name = "loom-connector"
version = "0.1.0"
description = "Khung `Connector` — hợp đồng mà mọi nguồn dữ liệu phải tuân theo"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=18.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_connector"]

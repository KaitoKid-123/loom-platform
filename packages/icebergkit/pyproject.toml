[project]
name = "loom-iceberg"
version = "0.1.0"
description = "Chỗ duy nhất trong hệ thống biết Apache Iceberg tồn tại"
requires-python = ">=3.12"
dependencies = [
    "loom-storage",
    "pyiceberg[pyarrow]>=0.10",
    "pyarrow>=18.0",
]

[tool.uv.sources]
loom-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_iceberg"]
